name: "Emulator Checks"
on:
  workflow_call:

jobs:
  emulator-checks:
    name: "Emulator Checks"
    runs-on: ubuntu-latest
    # Spike for issue #22. Failures here don't block the pull request.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Variable blocks in test files need 1.13 or later, and state_key needs 1.11.
          terraform_version: 1.13.4
          terraform_wrapper: false

      # run.sh starts the emulator itself, behind the proxy, so this only installs it.
      - name: Install AWS Emulator
        uses: synapsestudios/setup-aws-emulator@7819367a0b09b4ac4c69386fc1557784c4ada560 # v1.0.1
        with:
          version: 1.0.385
          start: false

      - name: Terraform Test
        run: tests/emulator/run.sh
