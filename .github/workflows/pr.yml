name: Pull Request Jobs
on:
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"
permissions:
  contents: write
  pull-requests: write
jobs:
  fast-checks:
    uses: ./.github/workflows/fast_checks.yml
  terraform-docs:
    needs: [fast-checks]
    uses: ./.github/workflows/tf-docs.yml
